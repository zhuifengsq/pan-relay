{% if frontend_friend_links.enabled and frontend_friend_links['items'] %}
<nav class="frontend-friend-links" aria-label="友情链接" style="margin: 0 auto 12px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 14px; text-align: center; font-size: 12px; line-height: 1.6;">
  <span style="font-weight: 700; opacity: .72; flex-shrink: 0;">友情链接：</span>
  <div style="display: inline-flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 14px;">
    {% for item in frontend_friend_links['items'] %}
    <a href="{{ item.url }}" target="_blank" rel="noopener noreferrer" style="font-size: 12px; text-decoration: none;">{{ item.name }}</a>
    {% endfor %}
  </div>
</nav>
{% endif %}
