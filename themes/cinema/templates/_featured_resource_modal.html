<div class="cinema-transfer-backdrop" id="cinemaTransferBackdrop" hidden></div>
<section class="cinema-transfer-modal" id="cinemaTransferModal" hidden role="dialog" aria-modal="true" aria-labelledby="cinemaTransferHeading">
  <header class="cinema-transfer-modal__heading">
    <h2 id="cinemaTransferHeading">资源链接</h2>
    <button type="button" data-cinema-transfer-close aria-label="关闭">×</button>
  </header>
  <div class="cinema-transfer-content" id="cinemaTransferContent">
    <h3 id="cinemaTransferTitle"></h3>
    <p class="cinema-transfer-link-row">资源地址：<a id="cinemaTransferLink" href="#" target="_blank" rel="noopener"></a></p>
    <footer class="cinema-transfer-modal__actions">
      <button type="button" id="cinemaTransferCopyBtn">复制链接</button>
      <button type="button" id="cinemaTransferOpenBtn">打开资源</button>
    </footer>
  </div>
</section>
